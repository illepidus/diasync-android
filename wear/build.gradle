plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ru.krotarnya.diasync2'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "ru.krotarnya.diasync2"
        minSdk 33
        targetSdk 37
        versionCode rootProject.ext.diasyncVersionCode
        versionName rootProject.ext.diasyncVersionName

    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

apply from: rootProject.file('gradle/release-signing.gradle')

dependencies {
    implementation project(':common')
    implementation libs.play.services.wearable
    implementation libs.wear.watchface.complications.data.source
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
}
