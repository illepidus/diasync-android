plugins {
    alias(libs.plugins.android.application)
}

configurations.matching { it.name.endsWith('RuntimeClasspath') }.configureEach {
    // AGP 9 adds Kotlin stdlib implicitly; WFF APK must remain resource-only.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
}

android {
    namespace 'ru.krotarnya.diasync2.watchface'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "ru.krotarnya.diasync2.watchface"
        minSdk 33
        targetSdk 37
        versionCode 1
        versionName "1.0"

    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources false
        }
    }
}
