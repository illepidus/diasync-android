plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ru.krotarnya.diasync.watchface'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "ru.krotarnya.diasync.watchface"
        minSdk 33
        targetSdk 37
        versionCode 1
        versionName "1.0"

    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.play.services.wearable
}